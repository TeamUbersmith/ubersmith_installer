[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ubersmith-installer"
version = "0.1.0"
description = "Python CLI installer for Ubersmith (Docker/Docker Compose runtime)."
readme = "README-python-cli.md"
requires-python = ">=3.9"
dependencies = [
    "docker>=7.1.0",
    "Jinja2>=3.1",
    "click>=8.1",
    "distro>=1.9",
    "cryptography>=42",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyYAML>=6.0",
]

[project.scripts]
ubersmith-installer = "ubersmith_installer.cli:main"

[tool.setuptools.packages.find]
include = ["ubersmith_installer*"]

[tool.setuptools.package-data]
# Non-.py assets rendered/copied at install time (Jinja templates and static
# helper files) -- without this, a real (non-editable) `pip install .` omits
# them and every render_*()/copy_*() call raises FileNotFoundError.
ubersmith_installer = ["templates/*.j2", "files/*"]
