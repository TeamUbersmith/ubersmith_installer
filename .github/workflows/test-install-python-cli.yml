name: Test Install (Python CLI, Ubuntu 24.04)

on:
  push:
    paths:
      - "ubersmith_installer/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test-install-python-cli.yml"
  pull_request:
    paths:
      - "ubersmith_installer/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test-install-python-cli.yml"

jobs:
  install:
    name: Install Ubersmith via Python CLI (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Docker is available
        run: docker version

      - name: Install package
        run: pip install -e .

      - name: Run installer non-interactively via the Python CLI
        run: |
          sudo "$(command -v ubersmith-installer)" install \
            --non-interactive \
            --ubersmith-major-version 5 \
            --ubersmith-home /usr/local/ubersmith \
            --lets-encrypt-certificate no \
            --virtual-host ubersmith.ci.test \
            --admin-email ci-test@ubersmith.com

      - name: Verify containers are up
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Smoke test HTTPS endpoint
        run: |
          curl -k -sS -o /dev/null -w '%{http_code}\n' \
            --resolve ubersmith.ci.test:443:127.0.0.1 \
            https://ubersmith.ci.test/ | grep -qE '^(200|30[123])$'

      - name: Dump logs on failure
        if: failure()
        run: |
          sudo docker ps -a
          sudo docker compose -f /usr/local/ubersmith/docker-compose.yml logs --tail=200 || true
