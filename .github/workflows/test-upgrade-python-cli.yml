name: Test Upgrade (Python CLI, Ubuntu 24.04)

# Proves the compatibility promise the Python CLI rewrite is built around:
# an existing, real Ansible-installed Ubersmith (major version 4) can be
# upgraded in place by the NEW Python CLI's `upgrade` command, and that
# doing so does not clobber site-specific admin customizations to
# docker-compose.override.yml.

on:
  push:
    paths:
      - "ubersmith_installer/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test-upgrade-python-cli.yml"
  pull_request:
    paths:
      - "ubersmith_installer/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/test-upgrade-python-cli.yml"

jobs:
  upgrade:
    name: Upgrade Ubersmith via Python CLI (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UBERSMITH_HOME: /usr/local/ubersmith
      OVERRIDE_MARKER: "# CI-CUSTOM-MARKER: hand-added admin customization, must survive upgrade"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify Docker is available
        run: docker version

      - name: Install Python 3.11+ venv support and expect
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv expect

      # Seeds a real, old (major version 4) install using the OLD Ansible
      # installer, exactly as test-install-ubuntu-24.04.yml does, but
      # targeting version 4 so the upgrade exercises real version-gated
      # migrations (caching_sha2_password, license reminder, sql_mode,
      # legacy docker-compose.override.yml fixups, etc.) instead of a no-op.
      #
      # run_install.exp hardcodes "5" as the answer to the "Choose which
      # version of Ubersmith to install (4 or 5)" prompt, so a dedicated
      # copy (run_install_v4.exp) answering "4" is used instead.
      #
      # Plain `sudo env ...` (not `sudo -E`) is used so HOME is reset to
      # /root for this run -- matching the plain `sudo` used later for
      # `ubersmith-installer upgrade`, so both commands agree on where
      # ~/.ubersmith_installer.ini (ansible_user_dir-relative) lives.
      - name: Run OLD Ansible installer non-interactively (ubersmith_major_version=4)
        run: |
          sudo env \
            ANSIBLE_NOCOLOR=1 \
            ANSIBLE_FORCE_COLOR=0 \
            UBERSMITH_INTERACTIVE=false \
            expect .github/scripts/run_install_v4.exp

      - name: Verify old install's containers are up
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Smoke test HTTPS endpoint (old install)
        run: |
          curl -k -sS -o /dev/null -w '%{http_code}\n' \
            --resolve ubersmith.ci.test:443:127.0.0.1 \
            https://ubersmith.ci.test/ | grep -qE '^(200|30[123])$'

      # The critical compatibility check: hand-customize
      # docker-compose.override.yml the way a real admin would (an
      # arbitrary comment/port mapping no template ever generates), then
      # after the upgrade assert it is still there verbatim -- proving
      # `upgrade` did NOT wholesale regenerate this file.
      - name: Hand-customize docker-compose.override.yml like a real admin would
        run: |
          sudo tee -a "$UBERSMITH_HOME/docker-compose.override.yml" > /dev/null <<EOF
          $OVERRIDE_MARKER
          EOF
          echo "--- docker-compose.override.yml after hand customization ---"
          sudo cat "$UBERSMITH_HOME/docker-compose.override.yml"

      - name: Install the Python CLI package
        run: pip install -e .

      - name: Run upgrade non-interactively via the Python CLI
        run: sudo env HOME=/root "$(command -v ubersmith-installer)" upgrade --non-interactive

      - name: Verify containers are up after upgrade
        run: docker ps --format '{{.Names}}\t{{.Status}}'

      - name: Smoke test HTTPS endpoint (post-upgrade)
        run: |
          curl -k -sS -o /dev/null -w '%{http_code}\n' \
            --resolve ubersmith.ci.test:443:127.0.0.1 \
            https://ubersmith.ci.test/ | grep -qE '^(200|30[123])$'

      - name: Assert hand-added docker-compose.override.yml customization survived verbatim
        run: |
          sudo grep -qF "$OVERRIDE_MARKER" "$UBERSMITH_HOME/docker-compose.override.yml"

      - name: Assert installer state was updated to the new (5.x) version
        run: |
          sudo cat /root/.ubersmith_installer.ini
          sudo grep -qE '^ubersmith_installed_version = 5\.' /root/.ubersmith_installer.ini

      - name: Dump logs on failure
        if: failure()
        run: |
          sudo docker ps -a
          sudo docker compose -f "$UBERSMITH_HOME/docker-compose.yml" logs --tail=200 || true
