---
# Targeted security patch for a PHP CVE (e.g. OPS-862).
#
# Unlike upgrade_ubersmith.yml, this does NOT re-render docker-compose.yml from
# the role templates (that would re-template every service and implicitly
# require an ubersmith_version bump). It only bumps the image tag on the
# services that are actually built on a php8X base, leaving web/db/redis/solr/
# backup/rsyslog/etc. exactly as they are.
#
# Services touched, and why:
#   ubersmith docker-compose.yml: php, mail, cron, rwhois (image repo: xinetd)
#   appliance docker-compose.yml: app_cron (image repo: appliance_cron)
#
# All four of mail/cron/xinetd/appliance_cron are hardcoded to build FROM
# ghcr.io/teamubersmith/php84 regardless of which php_version a given
# ubersmith_release line otherwise uses for its own "php" service — see
# docker/{mail,cron,appliance_cron,xinetd}/Dockerfile in the containers repo.
# So they always take the php84-line's target_release_version, never php82's.
#
# Usage:
#   ./patch_php_cve.sh
#   ./patch_php_cve.sh -e target_release_version=r6   # override the table below

- name: Apply a PHP CVE container patch
  hosts: local
  any_errors_fatal: true

  pre_tasks:
    - name: Check for .ubersmith_installer.ini
      ansible.builtin.stat:
        path: "{{ ansible_user_dir }}/.ubersmith_installer.ini"
      register: installer_config

    - name: Fail if installer configuration is not present
      ansible.builtin.fail:
        msg: "Ubersmith installer configuration file is not present, please run configure.sh"
      when: not installer_config.stat.exists

  vars:
    registry: ghcr.io/teamubersmith

    # Last known-good containers.release_version per ubersmith_release_version,
    # bumped by one, per the history in roles/ubersmith/vars/main.yml.
    # Only lines >= 5.0.0 are covered for now. Keep this updated as each line
    # is actually rebuilt and pushed -- a host whose installed version isn't a
    # key here will fail cleanly below rather than guessing.
    php_cve_release_versions:
      "5.0.0": r14
      "5.0.1": r4
      "5.0.2": r2
      "5.0.3": r3
      "5.1.0": r10
      "5.1.1": r2
      "5.1.2": r3
      "5.1.3": r3
      "5.2.0": r4
      "5.2.1": r3
      "5.2.2": r4
      "5.2.3": r3
      "5.3.0": r5

    # Image repos that are built on a php8X base and need the same bump as
    # whichever php8X image this host's "php" service uses.
    php_based_image_repos:
      - mail
      - cron
      - xinetd
      - appliance_cron

    ubersmith_installed_version: "{{ lookup('ini', 'ubersmith_installed_version section=ubersmith_installer file={{ ansible_user_dir }}/.ubersmith_installer.ini default=') }}"
    ubersmith_home: "{{ lookup('ini', 'ubersmith_home section=ubersmith_installer file={{ ansible_user_dir }}/.ubersmith_installer.ini default=') }}"
    appliance_installed_version: "{{ lookup('ini', 'appliance_installed_version section=ubersmith_installer file={{ ansible_user_dir }}/.ubersmith_installer.ini default=') }}"
    appliance_home: "{{ lookup('ini', 'appliance_home section=ubersmith_installer file={{ ansible_user_dir }}/.ubersmith_installer.ini default=') }}"

    # Allow an explicit override via -e target_release_version=rN, otherwise
    # look it up from the table above for whichever version(s) are installed.
    ubersmith_target_release_version: "{{ target_release_version | default(php_cve_release_versions[ubersmith_installed_version] | default('')) }}"
    appliance_target_release_version: "{{ target_release_version | default(php_cve_release_versions[appliance_installed_version] | default('')) }}"

  tasks:
    - name: Fail if neither ubersmith nor appliance is installed
      ansible.builtin.fail:
        msg: "Neither ubersmith_installed_version nor appliance_installed_version is set in .ubersmith_installer.ini"
      when:
        - ubersmith_installed_version == ''
        - appliance_installed_version == ''

    # --- Ubersmith stack ---
    - name: Ubersmith stack
      tags: patch
      when: ubersmith_installed_version != ''
      block:
        - name: Fail if no patched release_version is known for this ubersmith_installed_version
          ansible.builtin.fail:
            msg: >-
              No known PHP CVE patch release_version for ubersmith_installed_version
              {{ ubersmith_installed_version }}. Either this line hasn't been patched yet,
              or it's older than 5.0.0 and out of scope for this script. Contact
              support@ubersmith.com, or re-run with -e target_release_version=rN once
              you've confirmed the correct value.
          when: ubersmith_target_release_version == ''

        - name: Determine which php8X image repo this host's compose file uses
          ansible.builtin.shell: >-
            grep -oE '{{ registry }}/php[0-9]+:' {{ ubersmith_home }}/docker-compose.yml | head -1 | sed -E 's#.*/(php[0-9]+):#\1#'
          register: php_repo_detect
          changed_when: false

        - name: Fail if no php8X image could be detected
          ansible.builtin.fail:
            msg: "Could not find a {{ registry }}/phpNN image in {{ ubersmith_home }}/docker-compose.yml"
          when: php_repo_detect.stdout == ''

        - name: Set the new image tag
          ansible.builtin.set_fact:
            ubersmith_new_tag: "{{ ubersmith_installed_version }}-{{ ubersmith_target_release_version }}"
            ubersmith_image_repos: "{{ [php_repo_detect.stdout] + (php_based_image_repos | select('ne', 'appliance_cron') | list) }}"

        - name: Confirm the target images are actually published before touching anything
          ansible.builtin.command: docker manifest inspect {{ registry }}/{{ item }}:{{ ubersmith_new_tag }}
          loop: "{{ ubersmith_image_repos }}"
          register: manifest_check
          changed_when: false
          failed_when: manifest_check.rc != 0

        - name: Back up docker-compose.yml before editing
          ansible.builtin.copy:
            src: "{{ ubersmith_home }}/docker-compose.yml"
            dest: "{{ ubersmith_home }}/docker-compose.yml.bak-{{ '%Y%m%d%H%M%S' | strftime }}"
            remote_src: true
            mode: preserve

        - name: Bump the image tag for php8X-based services only
          ansible.builtin.replace:
            path: "{{ ubersmith_home }}/docker-compose.yml"
            regexp: '^(\s*image:\s*{{ registry | regex_escape }}/(?:{{ ubersmith_image_repos | join("|") }}):)\S+$'
            replace: '\1{{ ubersmith_new_tag }}'
          register: ubersmith_compose_patch

        - name: Report whether anything changed
          ansible.builtin.debug:
            msg: >-
              {{ 'Updated ' ~ ubersmith_image_repos | join(', ') ~ ' to ' ~ ubersmith_new_tag
                 if ubersmith_compose_patch.changed else
                 'docker-compose.yml already references ' ~ ubersmith_new_tag ~ ' (nothing to do)' }}

        - name: Pull the patched images
          ansible.builtin.command: docker compose pull php mail cron rwhois
          args:
            chdir: "{{ ubersmith_home }}"
          changed_when: true
          when: ubersmith_compose_patch.changed

        - name: Recreate only the patched services
          ansible.builtin.command: docker compose up -d --no-deps php mail cron rwhois
          args:
            chdir: "{{ ubersmith_home }}"
          changed_when: true
          when: ubersmith_compose_patch.changed

    # --- Appliance stack ---
    - name: Appliance stack
      tags: patch
      when: appliance_installed_version != ''
      block:
        - name: Fail if no patched release_version is known for this appliance_installed_version
          ansible.builtin.fail:
            msg: >-
              No known PHP CVE patch release_version for appliance_installed_version
              {{ appliance_installed_version }}. Contact support@ubersmith.com, or re-run
              with -e target_release_version=rN once you've confirmed the correct value.
          when: appliance_target_release_version == ''

        - name: Set the new appliance_cron image tag
          ansible.builtin.set_fact:
            appliance_new_tag: "{{ appliance_installed_version }}-{{ appliance_target_release_version }}"

        - name: Confirm the appliance_cron image is actually published
          ansible.builtin.command: docker manifest inspect {{ registry }}/appliance_cron:{{ appliance_new_tag }}
          changed_when: false

        - name: Back up appliance docker-compose.yml before editing
          ansible.builtin.copy:
            src: "{{ appliance_home }}/docker-compose.yml"
            dest: "{{ appliance_home }}/docker-compose.yml.bak-{{ '%Y%m%d%H%M%S' | strftime }}"
            remote_src: true
            mode: preserve

        - name: Bump the appliance_cron image tag
          ansible.builtin.replace:
            path: "{{ appliance_home }}/docker-compose.yml"
            regexp: '^(\s*image:\s*{{ registry | regex_escape }}/appliance_cron:)\S+$'
            replace: '\1{{ appliance_new_tag }}'
          register: appliance_compose_patch

        - name: Report whether anything changed
          ansible.builtin.debug:
            msg: >-
              {{ 'Updated appliance_cron to ' ~ appliance_new_tag
                 if appliance_compose_patch.changed else
                 'appliance docker-compose.yml already references ' ~ appliance_new_tag ~ ' (nothing to do)' }}

        - name: Pull the patched appliance_cron image
          ansible.builtin.command: docker compose pull app_cron
          args:
            chdir: "{{ appliance_home }}"
          changed_when: true
          when: appliance_compose_patch.changed

        - name: Recreate only app_cron
          ansible.builtin.command: docker compose up -d --no-deps app_cron
          args:
            chdir: "{{ appliance_home }}"
          changed_when: true
          when: appliance_compose_patch.changed
